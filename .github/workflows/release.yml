name: Release

# Builds the plugin from the tagged commit, attests the three release assets
# (build provenance, as the community directory's automated review expects),
# and creates the GitHub release. The tag must equal manifest.json's version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The tag equals manifest.json's version and is listed in versions.json
        run: |
          set -euo pipefail
          m=$(node -p "require('./manifest.json').version")
          test "$TAG" = "$m"
          test "$(node -p "require('./versions.json')['$m']")" = "$(node -p "require('./manifest.json').minAppVersion")"
          test -s main.js && test -s manifest.json && test -s styles.css
      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" \
            --notes "Built and attested by the Release workflow from tag $TAG. Assets: main.js, manifest.json, styles.css." \
            main.js manifest.json styles.css
