name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: The release artifacts exist and are not empty
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css
      - name: manifest.json, package.json, and versions.json agree on the version
        # Obsidian installs a release by the tag that equals manifest.json's version.
        run: |
          set -euo pipefail
          m=$(node -p "require('./manifest.json').version")
          p=$(node -p "require('./package.json').version")
          test "$m" = "$p"
          test "$(node -p "require('./versions.json')['$m']")" = "$(node -p "require('./manifest.json').minAppVersion")"
